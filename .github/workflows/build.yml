name: Build and update repo
on:
  push:
    branches: [main]
    paths: ['tweak/**', 'ipas/**', 'tools/**', '.github/workflows/build.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential fakeroot rsync curl perl git libxml2 dpkg-dev bzip2 gzip xz-utils unzip python3

      - name: Install Theos (toolchain)
        run: |
          export THEOS=$HOME/theos
          echo "THEOS=$THEOS" >> $GITHUB_ENV
          yes | bash -c "$(curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos)" || true

      - name: Get iOS SDK
        run: |
          git clone --depth=1 https://github.com/theos/sdks.git /tmp/sdks
          mkdir -p $THEOS/sdks
          rm -rf $THEOS/sdks/iPhoneOS9.3.sdk
          cp -R /tmp/sdks/iPhoneOS9.3.sdk $THEOS/sdks/
          printf '%s\n' '---' \
            'archs:                 [ armv7, armv7s, arm64, i386, x86_64 ]' \
            'platform:              ios' \
            'install-name:          /usr/lib/system/liblaunch.dylib' \
            'current-version:       1' \
            'compatibility-version: 1' \
            'exports:' \
            '  - archs:              [ armv7, armv7s, arm64, i386, x86_64 ]' \
            '    symbols:            [ _launch_stub_unused ]' \
            '...' > $THEOS/sdks/iPhoneOS9.3.sdk/usr/lib/system/liblaunch.tbd

      - name: Build tweak .deb
        run: |
          cd tweak
          make clean package FINALPACKAGE=1 TARGET=iphone:clang:9.3:6.0

      - name: Build debs from IPAs
        run: |
          mkdir -p ipas ipa_debs
          for f in ipas/*.ipa; do
            [ -e "$f" ] || continue
            if unzip -tq "$f" >/dev/null 2>&1; then
              bash tools/ipa2deb.sh "$f" ipa_debs || echo "::warning::Không đóng gói được $f"
            else
              echo "::warning::Bỏ qua $f vì không phải file IPA hợp lệ"
            fi
          done

      - name: Update repo files
        run: |
          rm -f debs/*.deb
          cp tweak/packages/*.deb debs/
          cp ipa_debs/*.deb debs/ 2>/dev/null || true
          dpkg-scanpackages -m debs /dev/null > Packages
          bzip2 -kf Packages
          gzip -kf Packages

      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A debs Packages Packages.bz2 Packages.gz
          git diff --cached --quiet || git commit -m "Update repo [skip ci]"
          git push
