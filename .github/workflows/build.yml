name: Build and update repo
on:
  push:
    branches: [main]
    paths: ['tweak/**', '.github/workflows/build.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential fakeroot rsync curl perl git libxml2 dpkg-dev bzip2 gzip xz-utils

      - name: Install Theos (toolchain)
        run: |
          export THEOS=$HOME/theos
          echo "THEOS=$THEOS" >> $GITHUB_ENV
          yes | bash -c "$(curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos)" || true

      - name: Get iOS SDK
        run: |
          git clone --depth=1 https://github.com/theos/sdks.git /tmp/sdks
          mkdir -p $THEOS/sdks
          rm -rf $THEOS/sdks/iPhoneOS9.3.sdk
          cp -R /tmp/sdks/iPhoneOS9.3.sdk $THEOS/sdks/
          # SDK 9.3 thiếu liblaunch.tbd -> tạo stub để linker không lỗi
          cat > $THEOS/sdks/iPhoneOS9.3.sdk/usr/lib/system/liblaunch.tbd <<'TBD'
          ---
          archs:                 [ armv7, armv7s, arm64, i386, x86_64 ]
          platform:              ios
          install-name:          /usr/lib/system/liblaunch.dylib
          current-version:       1
          compatibility-version: 1
          exports:
            - archs:              [ armv7, armv7s, arm64, i386, x86_64 ]
              symbols:            [ _launch_stub_unused ]
          ...
          TBD
          sed -i 's/^          //' $THEOS/sdks/iPhoneOS9.3.sdk/usr/lib/system/liblaunch.tbd
          echo "SDKVER=9.3" >> $GITHUB_ENV

      - name: Build .deb
        run: |
          cd tweak
          make clean package FINALPACKAGE=1 TARGET=iphone:clang:$SDKVER:6.0

      - name: Update repo files
        run: |
          rm -f debs/*.deb
          cp tweak/packages/*.deb debs/
          dpkg-scanpackages -m debs /dev/null > Packages
          bzip2 -kf Packages
          gzip -kf Packages

      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A debs Packages Packages.bz2 Packages.gz
          git diff --cached --quiet || git commit -m "Update repo [skip ci]"
          git push
